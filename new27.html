<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SweetMeet - Swim Meet Event Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #111827;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --accent-strong: #16a34a;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
      --border-subtle: #1f2937;
      --danger: #f97316;
      --favorite-bg: #fef3c7;
      --favorite-border: #facc15;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f2937 0, #020617 55%);
      color: var(--text-main);
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 12px 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    header {
      text-align: center;
      padding: 8px 10px 6px;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.03em;
    }

    header p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .info-box {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.1), rgba(59, 130, 246, 0.1));
      border-radius: 14px;
      padding: 8px 10px;
      font-size: 0.85rem;
      line-height: 1.3;
      border: 1px solid rgba(148, 163, 184, 0.35);
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.6);
    }

    .info-box strong {
      color: var(--accent-strong);
    }

    .nav-bar {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .nav-btn {
      flex: 0 0 48px;
      border-radius: 16px;
      border: 1px solid var(--border-subtle);
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-main);
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, border-color 0.15s, opacity 0.15s;
    }

    .nav-btn:active:not(:disabled) {
      transform: scale(0.96);
      background: #020617;
    }

    .nav-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .event-header {
      flex: 1;
      padding: 8px 10px;
      border-radius: 18px;
      background: radial-gradient(circle at top left, #1e293b 0, #020617 70%);
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 2px;
      transition: opacity 0.2s, filter 0.2s;
    }

    .event-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .event-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .event-meta {
      font-size: 0.78rem;
      color: var(--accent);
      margin-top: 2px;
    }

    .event-meta .pill {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      padding: 1px 6px;
      margin-left: 4px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.4);
      font-size: 0.73rem;
    }

    .event-header.event-done {
      opacity: 0.5;
      filter: grayscale(0.55);
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border-subtle);
    }

    .checkbox-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .checkbox-wrap input[type="checkbox"] {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      accent-color: var(--accent);
    }

    .next-fav-btn {
      flex: 0 0 auto;
      border-radius: 999px;
      border: none;
      padding: 6px 10px;
      font-size: 0.8rem;
      background: linear-gradient(135deg, var(--accent), var(--accent-strong));
      color: #022c22;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(22, 163, 74, 0.6);
      transition: transform 0.1s, box-shadow 0.1s, filter 0.1s;
      white-space: nowrap;
    }

    .next-fav-btn:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 3px 8px rgba(22, 163, 74, 0.45);
      filter: brightness(0.95);
    }

    .event-panel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.96);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.8);
    }

    .event-panel h2 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .swimmer-list {
      margin-top: 6px;
      padding: 0;
      list-style: none;
      max-height: calc(100vh - 305px);
      overflow-y: auto;
      border-radius: 12px;
      background: radial-gradient(circle at top left, rgba(15, 23, 42, 0.98), #020617);
      border: 1px solid rgba(30, 64, 175, 0.45);
    }

    @media (min-height: 750px) {
      .swimmer-list {
        max-height: calc(100vh - 340px);
      }
    }

    .swimmer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(31, 41, 55, 0.85);
    }

    .swimmer-row:last-child {
      border-bottom: none;
    }

    .swimmer-name {
      flex: 1;
      padding-right: 6px;
      color: #e5e7eb;
    }

    .swimmer-time {
      flex: 0 0 auto;
      font-variant-numeric: tabular-nums;
      font-size: 0.86rem;
      color: var(--text-muted);
    }

    .swimmer-row.favorite {
      background-color: var(--favorite-bg);
      border-left: 3px solid var(--favorite-border);
      font-weight: 600;
      color: #1f2933;
    }

    .swimmer-row.favorite .swimmer-name {
      color: #1f2933;
    }

    .swimmer-row.favorite .swimmer-time {
      color: #4b5563;
    }

    .fav-tag {
      font-size: 0.72rem;
      background: rgba(234, 179, 8, 0.16);
      border-radius: 999px;
      padding: 1px 6px;
      margin-left: 6px;
      color: #854d0e;
      border: 1px solid rgba(234, 179, 8, 0.6);
    }

    .empty-state {
      padding: 8px 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Thin scrollbars for swimmer list */
    .swimmer-list::-webkit-scrollbar {
      width: 6px;
    }
    .swimmer-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .swimmer-list::-webkit-scrollbar-thumb {
      background-color: rgba(148, 163, 184, 0.6);
      border-radius: 4px;
    }
  </style>
</head>

Young, Ezra (8)
# 6B Boy 7-8 25 Free 38.35S

# 12B Boy 7-8 25 Back 36.69S

# 20B Boy 7-8 50 Free NT

# 2 X 7-8 100 Free Relay C 3:00.00Y

Young, Maggie (12)
# 13B Girl 11-12 50 Back 39.32S

# 27B Girl 11-12 100 Medley 1:31.23S

# 41B Girl 11-12 50 Fly 39.44S

# 48 X 11-12 200 Free Relay A 1:00.00Y



Female Male Total

Individual Events 111 84 195

Individual Athletes 37 28 65

Relay Events 6

Relay Teams 16
`;

    const favoriteBaseNames = new Set([
      "Tucker, Ayden",
      "Tucker, Evie",
      "Idleman, Isaac",
      "Idleman, Lucas",
      "Idleman, Ruthie"
    ]);

    function extractMeetName(text) {
      const match = text.match(/Meet:\s*(.+)/);
      if (match) return match[1].trim();
      return "Swim Meet";
    }

    function parseSeedTime(token) {
      if (!token) return "NT";
      if (token === "NT") return "NT";
      const m = token.match(/^([\d:.]+)[A-Za-z]$/);
      if (m) return m[1];
      return token;
    }

    function parseEvents(raw) {
      const lines = raw.split(/\r?\n/);
      const eventsMap = new Map();
      const eventsArr = [];

      let currentSwimmerBase = null;
      let currentSwimmerAge = null;

      for (let rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;

        // Swimmer name line: "Last, First (Age)"
        const nameMatch = line.match(/^(.+?,\s+.+?)\s+\((\d+)\)/);
        if (nameMatch) {
          currentSwimmerBase = nameMatch[1].trim();
          currentSwimmerAge = nameMatch[2].trim();
          continue;
        }

        // Event line starts with '#'
        if (!line.startsWith("#")) continue;

        const afterHash = line.replace(/^#\s*/, "");
        const tokens = afterHash.split(/\s+/);
        if (!tokens.length) continue;

        let eventNumber = null;
        let heatLetter = "";
        let descriptionTokens = [];
        let seedTime = "NT";

        const firstTok = tokens[0];

        // Case 1: "28A" style (event+heat)
        if (/^\d+[A-Za-z]$/.test(firstTok)) {
          const numMatch = firstTok.match(/^(\d+)/);
          eventNumber = numMatch ? parseInt(numMatch[1], 10) : null;
          const heatMatch = firstTok.match(/\d+([A-Za-z])/);
          heatLetter = heatMatch ? heatMatch[1].toUpperCase() : "";

          const lastTok = tokens[tokens.length - 1];
          seedTime = parseSeedTime(lastTok);
          descriptionTokens = tokens.slice(1, tokens.length - 1);
        } else {
          // Case 2: number first, maybe relay or separate heat letter
          const numMatch = firstTok.match(/^(\d+)$/);
          if (!numMatch) continue;

          eventNumber = parseInt(numMatch[1], 10);

          const lastTok = tokens[tokens.length - 1];
          seedTime = parseSeedTime(lastTok);

          const relayIndex = tokens.findIndex(t => t.toLowerCase() === "relay");
          const isRelay = relayIndex !== -1;

          if (isRelay) {
            // Relay: heat letter is token after "Relay" if single letter
            if (relayIndex + 1 < tokens.length - 1 && /^[A-Za-z]$/.test(tokens[relayIndex + 1])) {
              heatLetter = tokens[relayIndex + 1].toUpperCase();
            } else {
              heatLetter = "";
            }
            let descSlice = tokens.slice(1, relayIndex + 1);
            descriptionTokens = descSlice.filter(t => t.toUpperCase() !== "X");
          } else {
            // Non-relay with numeric event and possible separate heat letter
            if (tokens.length >= 3 && /^[A-Za-z]$/.test(tokens[1])) {
              heatLetter = tokens[1].toUpperCase();
              descriptionTokens = tokens.slice(2, tokens.length - 1);
            } else {
              heatLetter = "";
              descriptionTokens = tokens.slice(1, tokens.length - 1);
            }
          }
        }

        if (eventNumber == null) continue;

        const eventKey = `${eventNumber}${heatLetter}`;
        let eventObj = eventsMap.get(eventKey);

        if (!eventObj) {
          eventObj = {
            eventNumber,
            heatLetter,
            description: descriptionTokens.join(" "),
            swimmers: [],
            hasFavorite: false
          };
          eventsMap.set(eventKey, eventObj);
          eventsArr.push(eventObj);
        }

        if (currentSwimmerBase) {
          const displayName = `${currentSwimmerBase} (${currentSwimmerAge || "?"})`;
          eventObj.swimmers.push({
            displayName,
            baseName: currentSwimmerBase,
            seedTime
          });
          if (favoriteBaseNames.has(currentSwimmerBase)) {
            eventObj.hasFavorite = true;
          }
        }
      }

      // Sort events by event number then heat letter A–Z
      eventsArr.sort((a, b) => {
        if (a.eventNumber !== b.eventNumber) {
          return a.eventNumber - b.eventNumber;
        }
        const aHeat = a.heatLetter || "";
        const bHeat = b.heatLetter || "";
        return aHeat.localeCompare(bHeat);
      });

      return eventsArr;
    }

    const events = parseEvents(meetText);
    let currentIndex = 0;
    const doneFlags = new Array(events.length).fill(false);

    const meetNameEl = document.getElementById("meetName");
    const infoBoxEl = document.getElementById("infoBox");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const eventHeaderEl = document.getElementById("eventHeader");
    const eventTitleEl = document.getElementById("eventTitle");
    const eventDescEl = document.getElementById("eventDescription");
    const eventMetaEl = document.getElementById("eventMeta");
    const doneCheckbox = document.getElementById("doneCheckbox");
    const nextFavBtn = document.getElementById("nextFavBtn");
    const eventPanelTitleEl = document.getElementById("eventPanelTitle");
    const swimmerListEl = document.getElementById("swimmerList");
    const emptyStateEl = document.getElementById("emptyState");

    function formatEventId(evt) {
      return `${evt.eventNumber}${evt.heatLetter || ""}`;
    }

    function updateInfoBox() {
      if (!events.length) {
        infoBoxEl.textContent = "No events found in this meet.";
        return;
      }

      const currentEvent = events[currentIndex];
      const currentHasFav = !!currentEvent.hasFavorite;

      let nextFavIndex = -1;
      for (let i = currentIndex + 1; i < events.length; i++) {
        if (events[i].hasFavorite) {
          nextFavIndex = i;
          break;
        }
      }

      let message = "";
      if (currentHasFav && nextFavIndex !== -1) {
        const delta = nextFavIndex - currentIndex;
        const nextEvt = events[nextFavIndex];
        const nextId = formatEventId(nextEvt);
        message =
          `<strong>Your swimmers are in this event.</strong> ` +
          `Next event with your swimmers is in ${delta} event(s): Event ${nextId}.`;
      } else if (currentHasFav && nextFavIndex === -1) {
        message =
          `<strong>Your swimmers are in this event.</strong> ` +
          `There are no more upcoming events for them after this.`;
      } else if (!currentHasFav && nextFavIndex !== -1) {
        const delta = nextFavIndex - currentIndex;
        const nextEvt = events[nextFavIndex];
        const nextId = formatEventId(nextEvt);
        message =
          `Next event with your swimmers is in ${delta} event(s): Event <strong>${nextId}</strong>.`;
      } else {
        message =
          `There are no upcoming events with your five swimmers after this.`;
      }

      infoBoxEl.innerHTML = message;
    }

    function renderEventHeader() {
      if (!events.length) {
        eventTitleEl.textContent = "No events";
        eventDescEl.textContent = "";
        eventMetaEl.textContent = "";
        eventHeaderEl.classList.remove("event-done");
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        return;
      }

      const evt = events[currentIndex];
      const eventId = formatEventId(evt);
      const heatText = evt.heatLetter ? `Heat ${evt.heatLetter}` : "Heat ?";
      eventTitleEl.textContent = `Event ${evt.eventNumber} – ${heatText}`;
      eventDescEl.textContent = evt.description || "No description available";

      const pos = `Event ${currentIndex + 1} of ${events.length}`;
      let metaHTML = pos;
      if (evt.hasFavorite) {
        metaHTML += ` <span class="pill">My swimmer here</span>`;
      }
      eventMetaEl.innerHTML = metaHTML;

      const isDone = !!doneFlags[currentIndex];
      if (isDone) {
        eventHeaderEl.classList.add("event-done");
      } else {
        eventHeaderEl.classList.remove("event-done");
      }

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === events.length - 1;
    }

    function renderSwimmers() {
      swimmerListEl.innerHTML = "";
      emptyStateEl.style.display = "none";

      if (!events.length) {
        emptyStateEl.textContent = "No swimmers to display.";
        emptyStateEl.style.display = "block";
        eventPanelTitleEl.textContent = "Swimmers & seed times";
        return;
      }

      const evt = events[currentIndex];
      const eventId = formatEventId(evt);
      eventPanelTitleEl.textContent = `Swimmers & seed times for Event ${eventId}`;

      if (!evt.swimmers.length) {
        emptyStateEl.textContent = "No swimmers listed for this event.";
        emptyStateEl.style.display = "block";
        return;
      }

      for (const swimmer of evt.swimmers) {
        const li = document.createElement("li");
        li.className = "swimmer-row";

        const isFavorite = favoriteBaseNames.has(swimmer.baseName);
        if (isFavorite) {
          li.classList.add("favorite");
        }

        const nameSpan = document.createElement("span");
        nameSpan.className = "swimmer-name";
        nameSpan.textContent = swimmer.displayName;

        if (isFavorite) {
          const favSpan = document.createElement("span");
          favSpan.className = "fav-tag";
          favSpan.textContent = "My swimmer";
          nameSpan.appendChild(favSpan);
        }

        const timeSpan = document.createElement("span");
        timeSpan.className = "swimmer-time";
        timeSpan.textContent = swimmer.seedTime || "NT";

        li.appendChild(nameSpan);
        li.appendChild(timeSpan);

        swimmerListEl.appendChild(li);
      }
    }

    function renderControls() {
      if (!events.length) {
        doneCheckbox.checked = false;
        doneCheckbox.disabled = true;
        nextFavBtn.disabled = true;
        return;
      }

      doneCheckbox.disabled = false;
      nextFavBtn.disabled = false;
      doneCheckbox.checked = !!doneFlags[currentIndex];
    }

    function renderAll() {
      renderEventHeader();
      renderSwimmers();
      renderControls();
      updateInfoBox();
    }

    function goToEvent(index) {
      if (index < 0 || index >= events.length) return;
      currentIndex = index;
      renderAll();
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        goToEvent(currentIndex - 1);
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < events.length - 1) {
        goToEvent(currentIndex + 1);
      }
    });

    doneCheckbox.addEventListener("change", () => {
      if (!events.length) return;
      doneFlags[currentIndex] = doneCheckbox.checked;
      renderEventHeader();
    });

    nextFavBtn.addEventListener("click", () => {
      if (!events.length) return;
      let targetIndex = -1;
      for (let i = currentIndex + 1; i < events.length; i++) {
        if (events[i].hasFavorite) {
          targetIndex = i;
          break;
        }
      }
      if (targetIndex !== -1) {
        goToEvent(targetIndex);
      }
    });

    function init() {
      const name = extractMeetName(meetText);
      meetNameEl.textContent = name;

      if (!events.length) {
        infoBoxEl.textContent = "No events found in the uploaded meet file.";
      }

      goToEvent(0);
    }

    // Initialize once DOM is ready (script is at the end, so DOM is already available)
    init();
  </script>
</body>
